name: Notion → GitHub Issue Sync

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Notion Issues to GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Notion QA Issues
        env:
          NOTION_API_KEY: ${{ secrets.NOTION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_DB_ID: "05edabfb94dd45e29c10c86f6a559d93"
        run: |
          chmod +x .github/scripts/sync-notion-issues.sh
          .github/scripts/sync-notion-issues.sh
